# https://taplo.tamasfe.dev/configuration/formatter-options.html

exclude = ["target/**"]

[formatting]
align_entries = false
trailing_newline = true
column_width = 120

[[rule]]
keys = [
  "dependencies",
  "dev-dependencies",
  "build-dependencies",
  "workspace.dependencies",
  "lints.rust",
  "lints.clippy",
  "workspace.lints.rust",
  "workspace.lints.clippy",
]

[rule.formatting]
reorder_keys = true
align_entries = true
