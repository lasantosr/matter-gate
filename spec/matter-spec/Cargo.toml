[package]
name = "matter-spec"
version = "0.2.0"
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Autogenerated Matter specification domain models, exhaustive enums, and typed cluster attributes"
readme = "README.md"
documentation = "https://docs.rs/matter-spec"
keywords = ["matter", "smart-home", "iot", "no-std", "embedded"]
categories = ["embedded", "no-std", "network-programming", "data-structures"]
exclude = ["AGENTS.md"]

[package.metadata.docs.rs]
features = ["v1_6", "all", "testing", "registry", "dispatch", "serde", "schemars", "jiff", "time", "uom"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
matter-data-model = { workspace = true }
thiserror         = { workspace = true }

bytes    = { workspace = true }
jiff     = { workspace = true, optional = true }
schemars = { workspace = true, features = ["derive"], optional = true }
serde    = { workspace = true, features = ["alloc", "derive"], optional = true }
time     = { workspace = true, optional = true }
uom      = { workspace = true, features = ["si", "f32", "f64"], optional = true }

[dev-dependencies]
serde_json = { workspace = true }

# AUTO-GENERATED BY cargo xtask codegen-spec (xtask/src/commands/codegen_spec/layout/manifest.rs) - DO NOT EDIT MANUALLY
[features]
# Core features
default = ["std"]
std = ["matter-data-model/std", "serde?/std", "bytes/std"]

# Optional Serialization & Schema Generation
serde = ["dep:serde", "matter-data-model/serde", "bytes/serde"]
schemars = ["dep:schemars", "std", "registry", "matter-data-model/schemars"]
deny-unknown-fields = ["matter-data-model/deny-unknown-fields"]

# Optional Ecosystem Type Conversions
jiff = ["dep:jiff"]
time = ["dep:time"]
uom = ["dep:uom"]

# Runtime Validation, Model Registry & Dispatch Envelopes
registry = []
dispatch = []

# Matter Specification Versions
v1_0 = []
v1_1 = []
v1_2 = []
v1_3 = []
v1_4 = []
v1_5 = []
v1_6 = []

