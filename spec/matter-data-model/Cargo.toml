[package]
name = "matter-data-model"
version = "0.1.0"
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Official Matter Data Model wire representations, identifiers, and interaction status codes"
readme = "README.md"
documentation = "https://docs.rs/matter-data-model"
keywords = ["matter", "smart-home", "iot", "home-automation", "model"]
categories = ["embedded", "no-std", "network-programming", "data-structures"]
exclude = ["AGENTS.md"]

[package.metadata.docs.rs]
features = ["std", "serde", "schemars"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["std"]
std = ["serde?/std", "bytes/std"]
serde = ["dep:serde", "bytes/serde"]
schemars = ["dep:schemars", "std"]
# Leaf-binary-only feature: library crates must NOT enable this.
deny-unknown-fields = []

[dependencies]
bytes    = { workspace = true }
schemars = { workspace = true, features = ["derive"], optional = true }
serde    = { workspace = true, features = ["alloc", "derive"], optional = true }

[lints]
workspace = true
